{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Officer Dashboard</h2>
    
    <div class="grid gap-6">
        {% for report in reports %}
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-lg font-semibold">Report #{{ report.id }}</h3>
                    <p class="text-gray-600">{{ report.description }}</p>
                    <p class="text-sm text-gray-500">Reports: {{ report.report_count }}</p>
                    <p class="text-sm text-gray-500">Reported: {{ report.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
                </div>
                <img src="{{ url_for('static', filename=report.image_path.split('/')[-1]) }}" 
                     class="w-32 h-32 object-cover rounded">
            </div>
            
            <form action="{{ url_for('assign_report', report_id=report.id) }}" method="POST" class="mt-4">
                <div class="flex gap-4">
                    <select name="worker_id" class="block w-full rounded-md border-gray-300 shadow-sm">
                        {% for worker in workers %}
                        <option value="{{ worker.id }}">{{ worker.username }}</option>
                        {% endfor %}
                    </select>
                    
                    <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600">
                        Assign Worker
                    </button>
                </div>
            </form>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
