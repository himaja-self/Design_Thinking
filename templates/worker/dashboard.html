{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Worker Dashboard</h2>
    
    <div class="grid gap-6">
        {% for report in reports %}
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-lg font-semibold">Report #{{ report.id }}</h3>
                    <p class="text-gray-600">{{ report.description }}</p>
                    <p class="text-sm text-gray-500">Reported: {{ report.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
                </div>
                <img src="{{ url_for('static', filename=report.image_path.split('/')[-1]) }}" 
                     class="w-32 h-32 object-cover rounded">
            </div>
            
            <form action="{{ url_for('update_report', report_id=report.id) }}" method="POST" class="mt-4">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Status Update</label>
                        <select name="status" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="delayed">Delayed</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Comment</label>
                        <textarea name="comment" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                    </div>
                    
                    <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                        Update Status
                    </button>
                </div>
            </form>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
